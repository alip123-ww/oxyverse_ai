<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXYVERSE // HYPERLINK</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <style>
        /* === 1. VISUAL CORE === */
        :root {
            --bg-deep: #030014;
            --bg-grad: radial-gradient(circle at 50% -20%, #1a1a40, #030014);
            
            --glass-base: rgba(10, 10, 15, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --glass-blur: 30px;
            
            --neon-1: #00f2ff;
            --neon-2: #7000ff;
            --neon-3: #ff0055;
            --neon-success: #00ff88;
            
            --grad-primary: linear-gradient(135deg, var(--neon-1), var(--neon-2));
            
            --text-main: #ffffff;
            --text-muted: #8a8a9b;
            
            --sidebar-w: 280px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body {
            background: var(--bg-deep); background-image: var(--bg-grad);
            color: var(--text-main); height: 100vh; overflow: hidden;
            font-family: 'Space Grotesk', sans-serif; font-size: 15px;
        }

        /* === 2. LOGIN (GATEKEEPER) === */
        #auth-layer {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(3, 0, 20, 0.9); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        
        .auth-card {
            width: 420px; padding: 50px;
            background: rgba(15, 15, 20, 0.8);
            border: 1px solid var(--glass-border); border-radius: 30px;
            text-align: center; box-shadow: 0 0 50px rgba(0, 242, 255, 0.1);
            position: relative; overflow: hidden;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        /* Background Animation inside Card */
        .auth-card::before {
            content:''; position: absolute; top:-50%; left:-50%; width:200%; height:200%;
            background: conic-gradient(transparent, var(--neon-1), transparent 30%);
            animation: rotate 4s linear infinite; opacity: 0.1; pointer-events: none;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        /* UNLOCK ANIMATION CLASSES */
        .auth-card.unlocking {
            animation: cardUnlock 0.8s forwards;
            border-color: var(--neon-success);
        }
        @keyframes cardUnlock {
            0% { transform: scale(1); box-shadow: 0 0 50px rgba(0, 255, 136, 0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 100px rgba(0, 255, 136, 0.8); background: rgba(0, 255, 136, 0.1); }
            100% { transform: scale(0); opacity: 0; }
        }

        .auth-logo { 
            font-family: 'JetBrains Mono'; font-size: 2.2rem; font-weight: 800; 
            background: var(--grad-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 30px; letter-spacing: -1px; position: relative; z-index: 2;
        }
        
        .inp-auth {
            width: 100%; padding: 16px; margin-bottom: 15px; 
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            border-radius: 16px; color: #fff; text-align: center;
            font-size: 1rem; transition: 0.3s; position: relative; z-index: 2;
        }
        .inp-auth:focus { border-color: var(--neon-1); background: rgba(255,255,255,0.05); box-shadow: 0 0 20px rgba(0, 242, 255, 0.1); }
        
        .btn-auth {
            width: 100%; padding: 16px; background: var(--grad-primary); border: none;
            border-radius: 16px; color: #fff; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: 0.3s; position: relative; z-index: 2;
            margin-top: 10px;
        }
        .btn-auth:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(112, 0, 255, 0.4); }
        
        /* Success State for Button */
        .btn-auth.success {
            background: var(--neon-success); color: #000;
            box-shadow: 0 0 30px var(--neon-success);
        }

        .shake { animation: shake 0.4s; border-color: var(--neon-3) !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* FLASH EFFECT OVERLAY */
        #warp-flash {
            position: fixed; inset: 0; background: #fff; z-index: 10000;
            opacity: 0; pointer-events: none;
        }
        .warp-active { animation: warpFlash 1.2s ease-out forwards; }
        @keyframes warpFlash {
            0% { opacity: 0; }
            20% { opacity: 0.8; background: var(--neon-1); } /* Cyan flash */
            100% { opacity: 0; }
        }

        /* === 3. APP LAYOUT (MAIN) === */
        #app-layer { 
            display: flex; width: 100%; height: 100%; opacity: 0; 
            transform: scale(1.1); /* Start slightly zoomed in */
            filter: blur(10px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        
        /* Class to trigger app entrance */
        .app-visible { opacity: 1 !important; transform: scale(1) !important; filter: blur(0) !important; }

        aside {
            width: var(--sidebar-w); background: rgba(5, 5, 10, 0.6);
            backdrop-filter: blur(var(--glass-blur));
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; padding: 30px 20px; gap: 20px;
        }
        .brand { 
            font-family: 'JetBrains Mono'; font-weight: 800; font-size: 1.5rem; 
            color: #fff; display: flex; gap: 12px; align-items: center; 
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .btn-new {
            width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border); border-radius: 14px;
            color: var(--neon-1); font-weight: 600; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-new:hover { background: rgba(0, 242, 255, 0.1); border-color: var(--neon-1); }

        #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .chat-row {
            padding: 14px; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            font-size: 0.95rem; display: flex; align-items: center; gap: 12px; transition: 0.2s;
            position: relative; border: 1px solid transparent;
        }
        .chat-row:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .chat-row.active { 
            background: linear-gradient(90deg, rgba(112, 0, 255, 0.15), transparent); 
            color: #fff; border-left: 3px solid var(--neon-2); 
        }
        .menu-dots { margin-left: auto; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; border-radius: 6px; }
        .chat-row:hover .menu-dots { opacity: 1; }
        .menu-dots:hover { background: rgba(255,255,255,0.2); color: #fff; }

        main { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        header {
            height: 80px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(to bottom, rgba(3,0,20,0.8), transparent);
        }
        .ws-title {
            font-weight: 700; font-size: 1.2rem; letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .user-pill {
            display: flex; align-items: center; gap: 12px; padding: 6px 8px 6px 18px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 40px;
            cursor: pointer; transition: 0.2s; backdrop-filter: blur(10px);
        }
        .user-pill:hover { border-color: var(--neon-1); box-shadow: 0 0 20px rgba(0, 242, 255, 0.1); }
        .avatar { width: 36px; height: 36px; background: var(--grad-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; }

        /* === 4. CHAT (RICH CONTENT) === */
        #chat-view {
            flex: 1; overflow-y: auto; padding: 20px 40px; display: flex; flex-direction: column; gap: 24px;
            scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
        }
        .msg { display: flex; gap: 18px; width: 100%; max-width: 900px; margin: 0 auto; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .msg.user { justify-content: flex-end; }
        
        .bubble {
            padding: 20px 26px; border-radius: 24px; font-size: 1rem; line-height: 1.7;
            position: relative; min-width: 60px; max-width: 85%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .msg.bot .bubble {
            background: #0f0f13; border: 1px solid var(--glass-border); color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .msg.user .bubble {
            background: var(--grad-primary); color: #fff;
            border-bottom-right-radius: 4px;
        }

        /* Typography Polish */
        .bubble h1, .bubble h2 { margin-top: 15px; color: #fff; font-weight: 700; letter-spacing: -0.5px; }
        .bubble code { font-family: 'JetBrains Mono'; background: rgba(0,0,0,0.3); padding: 3px 6px; border-radius: 4px; font-size: 0.9em; }
        .bubble ul { margin-left: 20px; }

        /* === 5. DOCK (COMMAND CENTER) === */
        .dock-area { padding: 30px 40px 50px; display: flex; justify-content: center; position: relative; z-index: 20; }
        .input-box {
            width: 100%; max-width: 850px;
            background: rgba(10, 10, 15, 0.7); backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 10px 10px 10px 18px; display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5); transition: 0.3s;
        }
        .input-box:focus-within { border-color: var(--neon-2); box-shadow: 0 0 40px rgba(112, 0, 255, 0.2); background: rgba(10, 10, 15, 0.9); }

        #file-preview {
            display: none; padding: 12px 16px; margin-bottom: 8px; margin-right: 8px;
            background: rgba(255,255,255,0.03); border-radius: 16px;
            align-items: center; justify-content: space-between; border: 1px solid var(--glass-border);
        }
        .file-info { display: flex; align-items: center; gap: 12px; color: var(--neon-1); font-weight: 500; }
        .file-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
        .btn-close { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-close:hover { background: var(--neon-3); }

        .input-row { display: flex; align-items: flex-end; gap: 14px; }
        .btn-attach {
            width: 48px; height: 48px; border-radius: 14px; border: none;
            background: transparent; color: var(--text-muted); font-size: 1.3rem;
            cursor: pointer; transition: 0.2s; flex-shrink: 0;
        }
        .btn-attach:hover { background: rgba(255,255,255,0.08); color: #fff; }
        
        textarea {
            flex: 1; background: transparent; border: none; color: #fff;
            padding: 14px 0; font-family: 'Space Grotesk'; font-size: 1.1rem;
            resize: none; max-height: 150px;
        }
        
        .btn-send {
            width: 52px; height: 52px; border-radius: 16px; border: none;
            background: var(--text-main); color: #000; font-size: 1.2rem;
            cursor: pointer; transition: 0.2s; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        }
        .btn-send:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.4); }
        .btn-send.stop { background: var(--neon-3); color: #fff; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 0, 85, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); } }

        /* CONTEXT MENU */
        #ctx-menu { position: fixed; z-index: 2000; display: none; width: 160px; background: rgba(20,20,25,0.95); border: 1px solid var(--glass-border); border-radius: 12px; padding: 6px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .ctx-item { padding: 10px 14px; font-size: 0.9rem; color: #ddd; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .ctx-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .ctx-item.del:hover { background: rgba(255, 0, 85, 0.2); color: var(--neon-3); }

        pre { background: #0b0b10 !important; border-radius: 12px; border: 1px solid var(--glass-border); margin-top: 15px; overflow: hidden; }
        code { font-family: 'JetBrains Mono' !important; font-size: 0.9em; padding: 20px !important; display: block; overflow-x: auto; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="auth-layer">
        <div class="auth-card" id="auth-card">
            <div class="auth-logo"><i class="fas fa-cube"></i> OXYVERSE</div>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="login-user" class="inp-auth" placeholder="Identity Name" required autocomplete="off">
                <input type="password" id="login-key" class="inp-auth" placeholder="Passkey (9999)" maxlength="4" required style="letter-spacing:4px; font-weight:bold;">
                <button type="submit" class="btn-auth" id="login-btn">INITIALIZE LINK</button>
            </form>
        </div>
    </div>

    <div id="warp-flash"></div>

    <div id="ctx-menu">
        <div class="ctx-item" onclick="menuAction('pin')"><i class="fas fa-thumbtack"></i> Pin</div>
        <div class="ctx-item" onclick="menuAction('rename')"><i class="fas fa-pen"></i> Rename</div>
        <div style="height:1px; background:rgba(255,255,255,0.1); margin:4px 0;"></div>
        <div class="ctx-item del" onclick="menuAction('delete')"><i class="fas fa-trash"></i> Delete</div>
    </div>

    <div id="app-layer">
        <aside>
            <div class="brand"><i class="fas fa-cube" style="color:var(--neon-1)"></i> OXYVERSE</div>
            <button class="btn-new" onclick="startNewChat()">
                <i class="fas fa-plus"></i> NEW CHAT
            </button>
            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:10px; letter-spacing:1px; font-weight:600;">ACTIVE NODES</div>
            <div id="history-list"></div>
        </aside>

        <main>
            <header>
                <div class="ws-title">NEXUS CONTROL</div>
                <div class="user-pill" onclick="logout()">
                    <div style="text-align:right;">
                        <div style="font-size:0.9rem; font-weight:600; color:#fff;" id="ui-name">User</div>
                        <div style="font-size:0.75rem; color:var(--neon-1);">Neural Link Active</div>
                    </div>
                    <div class="avatar" id="ui-avatar">U</div>
                </div>
            </header>

            <div id="chat-view"></div>

            <div class="dock-area">
                <div class="input-box">
                    <div id="file-preview">
                        <div class="file-info" id="file-info-content"></div>
                        <button class="btn-close" onclick="clearFile()"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="input-row">
                        <input type="file" id="hidden-file" hidden onchange="handleFileSelect(this)">
                        <button class="btn-attach" onclick="document.getElementById('hidden-file').click()"><i class="fas fa-paperclip"></i></button>
                        <textarea id="user-input" rows="1" placeholder="Type a command or message..." oninput="autoHeight(this)"></textarea>
                        <button class="btn-send" id="action-btn" onclick="handleAction()"><i class="fas fa-arrow-up"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        /* === SYSTEM CORE (v22) === */
        const CORRECT_KEY = "9999";
        const API_KEY = "sk-or-v1-hT20bbtIFYLyFmLOWFiGsskymntzCh2Ng5PX";
        let user = JSON.parse(localStorage.getItem('oxy_v22_user'));
        let sessions = JSON.parse(localStorage.getItem('oxy_v22_sessions')) || [];
        let currentId = null;
        let selectedFile = null;
        let abortController = null;
        let isGenerating = false;
        let menuTargetId = null;

        // Auto Login if exists
        if(user) {
            document.getElementById('auth-layer').style.display = 'none';
            document.getElementById('app-layer').classList.add('app-visible');
            enterApp(true); // true means skip animation
        }

        /* === AUTH & ANIMATION === */
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-user').value;
            const k = document.getElementById('login-key');
            const btn = document.getElementById('login-btn');
            const card = document.getElementById('auth-card');
            const flash = document.getElementById('warp-flash');
            const app = document.getElementById('app-layer');

            if(k.value !== CORRECT_KEY) {
                k.classList.add('shake'); k.value=''; setTimeout(()=>k.classList.remove('shake'), 500); return;
            }

            // --- ANIMATION SEQUENCE START ---
            
            // 1. Button Success State
            btn.innerHTML = "<i class='fas fa-check'></i> ACCESS GRANTED";
            btn.classList.add('success');

            // 2. Card Unlock Animation (Delay 0.2s)
            setTimeout(() => {
                card.classList.add('unlocking');
            }, 200);

            // 3. Screen Flash (Delay 0.8s)
            setTimeout(() => {
                flash.classList.add('warp-active');
                
                // Hide Auth Layer mid-flash
                setTimeout(() => {
                    document.getElementById('auth-layer').style.display = 'none';
                    app.classList.add('app-visible'); // App Zoom In
                }, 200);

                // Save Data & Init App
                const newUser = { name: u, avatar: u.charAt(0).toUpperCase() };
                localStorage.setItem('oxy_v22_user', JSON.stringify(newUser));
                user = newUser;
                enterApp(false);

            }, 800);
        }

        function logout() { if(confirm("Terminate Session?")) { localStorage.removeItem('oxy_v22_user'); location.reload(); } }
        
        function enterApp(skipInit = false) {
            document.getElementById('ui-name').innerText = user.name;
            document.getElementById('ui-avatar').innerText = user.avatar;
            if(!skipInit) initChat();
            else if(sessions.length > 0) loadChat(sessions[0].id);
            else startNewChat();
            renderHistory();
        }

        /* === LOGIC === */
        function handleFileSelect(inp) {
            if(inp.files[0]) {
                const r = new FileReader();
                r.onload = (e) => {
                    selectedFile = { name: inp.files[0].name, type: inp.files[0].type, data: e.target.result };
                    document.getElementById('file-preview').style.display = 'flex';
                    const content = document.getElementById('file-info-content');
                    if(selectedFile.type.startsWith('image')) content.innerHTML = `<img src="${selectedFile.data}" class="file-thumb" style="width:40px;height:40px;object-fit:cover;border-radius:8px;"> ${selectedFile.name}`;
                    else content.innerHTML = `<i class="fas fa-file-alt"></i> ${selectedFile.name}`;
                };
                r.readAsDataURL(inp.files[0]);
            }
        }
        function clearFile() { selectedFile=null; document.getElementById('hidden-file').value=''; document.getElementById('file-preview').style.display='none'; }

        function handleAction() { isGenerating ? stopGeneration() : sendMessage(); }
        
        function stopGeneration() {
            if(abortController) { abortController.abort(); abortController = null; }
            isGenerating = false; updateBtn(false);
            const last = document.querySelector('.msg.bot:last-child .bubble');
            if(last) last.insertAdjacentHTML('beforeend', ' <span style="color:#ff0055; font-size:0.8em; margin-left:5px;">■ TERMINATED</span>');
        }

        function updateBtn(gen) {
            const btn = document.getElementById('action-btn');
            if(gen) { btn.innerHTML = '<i class="fas fa-square"></i>'; btn.classList.add('stop'); }
            else { btn.innerHTML = '<i class="fas fa-arrow-up"></i>'; btn.classList.remove('stop'); }
        }

        async function sendMessage() {
            const txtInput = document.getElementById('user-input');
            const text = txtInput.value.trim();
            if(!text && !selectedFile) return;

            const attachment = selectedFile ? {...selectedFile} : null;
            appendMsg('user', text, attachment);
            
            txtInput.value=''; autoHeight(txtInput); clearFile(); txtInput.focus();

            const session = sessions.find(s => s.id === currentId);
            session.messages.push({ role: 'user', content: text, attachment: attachment });
            if(session.title === "New Chat") { session.title = text.substring(0, 25) || "Data Upload"; renderHistory(); }
            saveData();

            const bid = 'bot-'+Date.now();
            document.getElementById('chat-view').insertAdjacentHTML('beforeend', `
                <div class="msg bot"><div class="bubble" id="${bid}"><span style="opacity:0.6">processing data...</span></div></div>
            `);
            scrollToBottom();

            isGenerating = true; updateBtn(true); abortController = new AbortController();

            try {
                let visionContext = attachment ? (attachment.type.startsWith('image') ? `[USER IMAGE: "${attachment.name}". ANALYZE VISUALLY.]` : `[USER FILE: "${attachment.name}"]`) : "";
                
                // === PERSONA: COOL & EMOJI ===
                const sys = `(System: You are OXYVERSE. Identity: Cool, Tech-Savvy, Slang (Indonesian Lo-Gue), Futuristic. Use Emojis 🚀🔥💎 generously. Be helpful but with style. User: ${user.name}.)`;
                const finalPrompt = `${sys}\n${visionContext}\nUser: ${text}`;

                const res = await fetch(`https://api.byleeos.my.id/api/jailbreak?text=${encodeURIComponent(finalPrompt)}&key=${API_KEY}`, { signal: abortController.signal });
                const data = await res.json();
                const reply = data.reply || data.result || "System Error ⚠️";

                const el = document.getElementById(bid);
                if(isGenerating) {
                    await fastType(el, reply);
                    session.messages.push({ role: 'bot', content: reply });
                    saveData();
                }
            } catch(e) { if(e.name !== 'AbortError') document.getElementById(bid).innerText = "Connection Lost 🔴"; } 
            finally { isGenerating = false; updateBtn(false); abortController = null; }
        }

        async function fastType(el, text) {
            el.innerHTML = ""; let idx = 0; const spd = text.length > 200 ? 5 : 12; const chk = text.length > 200 ? 5 : 2;
            while(idx < text.length && isGenerating) {
                el.innerHTML = marked.parse(text.substring(0, idx + chk));
                scrollToBottom(); idx += chk; await new Promise(r => setTimeout(r, spd));
            }
            if(isGenerating) { el.innerHTML = marked.parse(text); highlight(el); }
        }

        function appendMsg(role, text, att) {
            const box = document.getElementById('chat-view');
            let media = '';
            if(att) {
                if(att.type.startsWith('image')) media = `<div style="margin-bottom:12px; border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.1);"><img src="${att.data}" style="max-width:300px; display:block;" onclick="window.open(this.src)"></div>`;
                else media = `<div style="background:rgba(255,255,255,0.1); padding:10px 14px; border-radius:10px; margin-bottom:10px; display:inline-block; border:1px solid rgba(255,255,255,0.1);">📂 ${att.name}</div><br>`;
            }
            box.insertAdjacentHTML('beforeend', `<div class="msg ${role}"><div class="bubble">${media}${marked.parse(text||'')}</div></div>`);
            highlight(box); scrollToBottom();
        }

        function highlight(p) { p.querySelectorAll('pre code').forEach(b => Prism.highlightElement(b)); }

        function initChat() { if(sessions.length > 0) loadChat(sessions[0].id); else startNewChat(); renderHistory(); }
        function startNewChat() {
            currentId = Date.now().toString();
            sessions.unshift({ id: currentId, title: "New Chat", pinned: false, messages: [] });
            saveData();
            document.getElementById('chat-view').innerHTML = `<div class="msg bot"><div class="bubble">Yo <strong>${user.name}</strong>! 👋 OXYVERSE Online 🟢. Ready buat bantu lo coding atau diskusi! 🚀</div></div>`;
            renderHistory();
        }
        function loadChat(id) {
            currentId = id; const s = sessions.find(x => x.id === id); const box = document.getElementById('chat-view'); box.innerHTML = '';
            if(s.messages.length===0) box.innerHTML = `<div class="msg bot"><div class="bubble">Yo <strong>${user.name}</strong>! 👋 OXYVERSE Online 🟢.</div></div>`;
            else s.messages.forEach(m => appendMsg(m.role, m.content, m.attachment));
            renderHistory();
        }
        function renderHistory() {
            const list = document.getElementById('history-list'); list.innerHTML = '';
            sessions.sort((a,b) => (b.pinned - a.pinned) || (b.id - a.id));
            sessions.forEach(s => {
                const d = document.createElement('div'); d.className = `chat-row ${s.id === currentId ? 'active' : ''}`;
                d.onclick = (e) => { if(!e.target.closest('.menu-dots')) loadChat(s.id); };
                const pin = s.pinned ? '<i class="fas fa-thumbtack" style="font-size:0.7em; color:var(--neon-1); margin-right:5px;"></i>' : '';
                d.innerHTML = `${pin}<span style="flex:1; overflow:hidden; text-overflow:ellipsis;">${s.title}</span><div class="menu-dots" onclick="openMenu(event, '${s.id}')"><i class="fas fa-ellipsis-v" style="font-size:0.8rem"></i></div>`;
                list.appendChild(d);
            });
        }
        function openMenu(e, id) { e.stopPropagation(); menuTargetId = id; const m = document.getElementById('ctx-menu'); m.style.display='block'; m.style.top=e.clientY+'px'; m.style.left=(e.clientX+10)+'px'; }
        document.addEventListener('click', (e) => { if(!e.target.closest('#ctx-menu')) document.getElementById('ctx-menu').style.display='none'; });
        function menuAction(act) {
            const idx = sessions.findIndex(s => s.id === menuTargetId); if(idx===-1) return;
            if(act==='delete' && confirm('Delete chat?')) { sessions.splice(idx,1); if(sessions.length===0) startNewChat(); else loadChat(sessions[0].id); }
            else if(act==='rename') { const t=prompt('Rename:', sessions[idx].title); if(t) sessions[idx].title=t; }
            else if(act==='pin') { sessions[idx].pinned = !sessions[idx].pinned; }
            saveData(); renderHistory();
        }
        function saveData() { localStorage.setItem('oxy_v22_sessions', JSON.stringify(sessions)); }
        function autoHeight(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,150)+'px'; }
        function scrollToBottom() { const b = document.getElementById('chat-view'); b.scrollTop = b.scrollHeight; }
        document.getElementById('user-input').addEventListener('keydown', (e) => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); handleAction(); }});
    </script>
</body>
</html>
